<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>《赞比的遗产》S03 母亲之死</title>
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#10151d}
  svg{display:block}
  .sub{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-weight:300;letter-spacing:1px}
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 阴雨天空 -->
    <linearGradient id="rainSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161E"/>
      <stop offset="0.6" stop-color="#181E28"/>
      <stop offset="1" stop-color="#1F2731"/>
    </linearGradient>
    <!-- 泥泞地面 -->
    <linearGradient id="rainGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181E28"/>
      <stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
    <!-- 水洼反光（映冷天光） -->
    <linearGradient id="puddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4A5E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1A222C" stop-opacity="0.3"/>
    </linearGradient>
    <!-- 芯片辉光 -->
    <radialGradient id="chipGlowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FC1E0" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#4FC1E0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4FC1E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 垃圾堆锈金属 -->
    <linearGradient id="rustMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A3E28"/>
      <stop offset="0.55" stop-color="#3E2C1C"/>
      <stop offset="1" stop-color="#241A12"/>
    </linearGradient>
    <!-- 发光滤镜 -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <g id="world">
    <!-- ============ 雨天场景（0-19s） ============ -->
    <g id="rainyScene">
      <rect x="0" y="0" width="1920" height="1080" fill="url(#rainSky)"/>

      <!-- 远处废墟剪影（插画级：断壁/残梁/钢筋） -->
      <g id="ruins" fill="#0D1118">
        <!-- 断墙（有破损边缘） -->
        <path d="M 80 660 L 80 520 L 150 520 L 150 500 L 210 500 L 210 540 L 240 540 L 240 660 Z" opacity="0.75"/>
        <path d="M 200 660 L 200 540 L 250 540 L 250 460 L 310 460 L 310 480 L 340 480 L 340 660 Z" opacity="0.6"/>
        <path d="M 320 660 L 320 560 L 380 560 L 380 580 L 430 580 L 430 660 Z" opacity="0.7"/>
        <!-- 右侧断壁 -->
        <path d="M 1420 660 L 1420 520 L 1480 520 L 1480 480 L 1540 480 L 1540 540 L 1580 540 L 1580 660 Z" opacity="0.6"/>
        <path d="M 1560 660 L 1560 500 L 1610 500 L 1610 440 L 1680 440 L 1680 460 L 1740 460 L 1740 660 Z" opacity="0.75"/>
        <!-- 残梁（斜） -->
        <rect x="420" y="470" width="260" height="10" transform="rotate(12 550 475)" opacity="0.5"/>
        <rect x="1300" y="450" width="220" height="9" transform="rotate(-10 1410 455)" opacity="0.5"/>
      </g>
      <!-- 废墟轮廓光（受冷天光） -->
      <g stroke="#4A5A6E" stroke-width="1.5" fill="none" opacity="0.3">
        <path d="M 80 520 L 150 520 L 150 500 L 210 500"/>
        <path d="M 1420 520 L 1480 520 L 1480 480 L 1540 480"/>
        <path d="M 1560 500 L 1610 500 L 1610 440 L 1680 440"/>
      </g>

      <!-- 地面 -->
      <rect x="0" y="660" width="1920" height="420" fill="url(#rainGround)"/>
      <!-- 水洼（反光 + 涟漪） -->
      <g id="puddles">
        <ellipse cx="820" cy="800" rx="170" ry="19" fill="url(#puddle)"/>
        <ellipse cx="1240" cy="870" rx="130" ry="15" fill="url(#puddle)"/>
        <ellipse cx="300" cy="900" rx="110" ry="12" fill="url(#puddle)"/>
        <!-- 雨滴涟漪（JS 控制扩散） -->
        <ellipse id="ripple1" cx="820" cy="800" rx="20" ry="3" fill="none" stroke="#5A7A9A" stroke-width="1.5" opacity="0"/>
        <ellipse id="ripple2" cx="1240" cy="870" rx="16" ry="2.5" fill="none" stroke="#5A7A9A" stroke-width="1.5" opacity="0"/>
      </g>

      <!-- 母亲倒地（插画级剪影：长发/衣服褶皱/冷光轮廓） -->
      <g id="mother">
        <!-- 身体（躺姿，头右身左，衣服有褶皱） -->
        <g fill="#0D1118">
          <!-- 躯干（躺） -->
          <path d="M 640 700 Q 700 716 800 714 L 980 728 Q 1040 734 1060 730 L 1050 756 Q 980 762 900 758 L 760 752 Q 660 748 630 730 Z"/>
          <!-- 长发（散落地面的发丝） -->
          <path d="M 720 690 Q 700 706 668 718 Q 640 730 620 740 L 640 752 Q 668 740 692 728 Q 716 716 728 706 Z" fill="#0A0D13"/>
          <path d="M 730 686 Q 714 712 690 730 L 706 738 Q 726 718 738 700 Z" fill="#0A0D13"/>
          <!-- 头 -->
          <circle cx="742" cy="688" r="29" fill="#0D1118"/>
          <!-- 右臂（摊开） -->
          <path d="M 800 722 L 980 736 Q 1060 742 1100 730 L 1096 752 Q 1040 762 970 756 L 810 744 Z"/>
          <!-- 左臂（压在身下，露出手） -->
          <path d="M 660 712 L 640 738 L 648 748 L 676 730 Z" fill="#0A0D13"/>
        </g>
        <!-- 衣服褶皱线 -->
        <g stroke="#1A222C" stroke-width="1.5" fill="none" opacity="0.6">
          <path d="M 700 726 Q 720 740 748 742"/>
          <path d="M 820 726 Q 850 738 880 740"/>
          <path d="M 920 730 Q 950 740 980 740"/>
        </g>
        <!-- 冷光轮廓（rim light） -->
        <g stroke="#4FC1E0" stroke-width="1.6" fill="none" opacity="0.35">
          <path d="M 640 700 Q 700 716 800 714 L 980 728"/>
          <circle cx="742" cy="688" r="29"/>
          <path d="M 712 696 Q 700 708 682 720"/>
        </g>
      </g>

      <!-- 少年跪伏（趴在母亲身上，插画级剪影） -->
      <g id="boyKneel">
        <g fill="#05070C">
          <!-- 身体（俯身弓起） -->
          <path d="M 600 712 Q 588 740 596 762 L 636 770 Q 668 774 692 760 L 700 742 Q 668 748 640 738 Q 614 730 604 712 Z"/>
          <!-- 头（低头，趴在母亲身上） -->
          <circle cx="620" cy="668" r="25" fill="#05070C"/>
          <!-- 乱发 -->
          <path d="M 596 662 Q 588 644 602 636 Q 620 630 640 644 Q 648 652 642 662 Q 624 648 606 650 Z" fill="#020308"/>
          <!-- 左臂（撑地） -->
          <path d="M 606 720 L 580 742 L 588 756 L 612 738 Z"/>
          <!-- 手（手指） -->
          <g stroke="#05070C" stroke-width="2.5" stroke-linecap="round">
            <line x1="584" y1="746" x2="580" y2="758"/>
            <line x1="590" y1="748" x2="588" y2="760"/>
            <line x1="596" y1="750" x2="596" y2="762"/>
          </g>
        </g>
        <!-- 冷光轮廓 -->
        <g stroke="#4FC1E0" stroke-width="1.5" fill="none" opacity="0.3">
          <circle cx="620" cy="668" r="25"/>
          <path d="M 604 700 Q 592 726 596 756"/>
        </g>
      </g>

      <!-- 芯片（冰青发光，情感焦点） -->
      <g id="chip">
        <circle id="chipGlow" cx="692" cy="742" r="80" fill="url(#chipGlowGrad)" filter="url(#softGlow)" opacity="0"/>
        <circle id="chipCore" cx="692" cy="742" r="4" fill="#4FC1E0" filter="url(#glow)" opacity="0"/>
        <!-- 芯片细节（微型电路线） -->
        <g id="chipDetail" opacity="0" stroke="#8B9ED8" stroke-width="0.8" fill="none">
          <rect x="686" y="736" width="12" height="12" rx="1.5" stroke="#4FC1E0"/>
          <line x1="686" y1="740" x2="678" y2="740"/>
          <line x1="698" y1="742" x2="706" y2="742"/>
        </g>
      </g>

      <!-- 雨丝（JS 生成：远近两层 + 溅落） -->
      <g id="rain"></g>
    </g>

    <!-- ============ 垃圾堆场景（16-35.5s） ============ -->
    <g id="junkScene" opacity="0">
      <rect x="0" y="0" width="1920" height="1080" fill="#12161E"/>
      <!-- 远景（阴天余晖） -->
      <rect x="0" y="0" width="1920" height="660" fill="#161C26"/>
      <rect x="0" y="540" width="1920" height="120" fill="#1A222C" opacity="0.5"/>
      <!-- 地面 -->
      <rect x="0" y="660" width="1920" height="420" fill="#10141C"/>

      <!-- 垃圾堆（插画级锈金属） -->
      <g id="junkDebris">
        <!-- 左垃圾堆 -->
        <rect x="360" y="820" width="112" height="66" rx="4" fill="url(#rustMetal)"/>
        <rect x="360" y="820" width="112" height="9" fill="#6A4A30" opacity="0.55"/>
        <rect x="430" y="790" width="78" height="42" rx="3" fill="url(#rustMetal)"/>
        <rect x="430" y="790" width="78" height="6" fill="#7A5838" opacity="0.5"/>
        <rect x="500" y="860" width="72" height="38" rx="3" fill="#241A12"/>
        <!-- 齿轮 -->
        <g transform="translate(560 838)">
          <circle r="20" fill="#3E2C1C" stroke="#5A3E28" stroke-width="4"/>
          <circle r="9" fill="#241A12"/>
          <g stroke="#5A3E28" stroke-width="3">
            <line x1="0" y1="-20" x2="0" y2="-24"/><line x1="0" y1="20" x2="0" y2="24"/>
            <line x1="-20" y1="0" x2="-24" y2="0"/><line x1="20" y1="0" x2="24" y2="0"/>
            <line x1="-14" y1="-14" x2="-17" y2="-17"/><line x1="14" y1="14" x2="17" y2="17"/>
            <line x1="14" y1="-14" x2="17" y2="-17"/><line x1="-14" y1="14" x2="-17" y2="17"/>
          </g>
        </g>
        <!-- 废轮胎 -->
        <ellipse cx="680" cy="842" rx="48" ry="22" fill="#0D1118" stroke="#1E2530" stroke-width="6"/>
        <ellipse cx="680" cy="842" rx="24" ry="10" fill="#12161E"/>
        <!-- 右垃圾堆 -->
        <rect x="1280" y="830" width="96" height="56" rx="4" fill="url(#rustMetal)"/>
        <rect x="1280" y="830" width="96" height="8" fill="#6A4A30" opacity="0.55"/>
        <rect x="1340" y="800" width="64" height="36" rx="3" fill="url(#rustMetal)"/>
        <rect x="1500" y="850" width="80" height="44" rx="3" fill="#241A12"/>
        <circle cx="1560" cy="840" r="16" fill="#3E2C1C" stroke="#5A3E28" stroke-width="4"/>
        <circle cx="1560" cy="840" r="6" fill="#241A12"/>
      </g>

      <!-- 少年蹲姿（插画级，JS 插入） -->
      <g id="boySquatWrap"></g>

      <!-- 光纤 + 芯片（发光脉动） -->
      <g id="fiber">
        <!-- 芯片 -->
        <circle cx="948" cy="760" r="5" fill="#4FC1E0" filter="url(#glow)" opacity="0.9"/>
        <circle cx="948" cy="760" r="18" fill="url(#chipGlowGrad)" filter="url(#softGlow)" opacity="0.7"/>
        <!-- 光纤（垂落到下方） -->
        <path d="M 948 762 Q 936 820 948 878" fill="none" stroke="#4FC1E0" stroke-width="1.8" opacity="0.6" filter="url(#glow)"/>
        <circle cx="948" cy="880" r="3" fill="#4FC1E0" filter="url(#glow)" opacity="0.6"/>
        <!-- 光纤数据光点（沿线上行） -->
        <circle id="fiberDot" cx="948" cy="860" r="2.5" fill="#8B9ED8" filter="url(#glow)" opacity="0"/>
      </g>
    </g>
  </g>

  <!-- 字幕 -->
  <g id="subtitleGroup">
    <rect id="subBg" x="360" y="952" width="1200" height="72" rx="8" fill="#0B0E14" fill-opacity="0.66" opacity="0"/>
    <text id="subText" class="sub" x="960" y="1000" text-anchor="middle" font-size="34" fill="#d9e6f0" opacity="0">他的母亲死在一个雨天。</text>
  </g>

  <!-- 渐暗转场 -->
  <rect id="fadeOut" x="0" y="0" width="1920" height="1080" fill="#000" opacity="0"/>
</svg>

<script src="characters.js"></script>
<script>
  window.SCENE_DURATION = 35.8;

  // ---- 插入少年蹲姿（垃圾堆场景） ----
  var boySquat = CH.zhanbiChildSquat();
  boySquat.setAttribute('transform', 'translate(960, 850) scale(1.7)');
  document.getElementById('boySquatWrap').appendChild(boySquat);

  // ---- 雨丝（远近两层） ----
  var rain = [];
  (function buildRain(){
    var g = document.getElementById('rain');
    var NS = 'http://www.w3.org/2000/svg';
    // 远雨（细密慢）
    for (var i = 0; i < 150; i++) {
      var l = document.createElementNS(NS, 'line');
      var x = Math.random() * 1960;
      var y = Math.random() * 1080;
      var len = 12 + Math.random() * 18;
      var sp = 480 + Math.random() * 300;
      l.setAttribute('x1', x); l.setAttribute('y1', y);
      l.setAttribute('x2', x - 3); l.setAttribute('y2', y + len);
      l.setAttribute('stroke', '#4A6A88');
      l.setAttribute('stroke-width', 1);
      l.setAttribute('opacity', (0.10 + Math.random() * 0.18).toFixed(2));
      g.appendChild(l);
      rain.push({el: l, x: x, y: y, len: len, sp: sp});
    }
    // 近雨（粗疏快）
    for (var j = 0; j < 70; j++) {
      var l2 = document.createElementNS(NS, 'line');
      var x2 = Math.random() * 1960;
      var y2 = Math.random() * 1080;
      var len2 = 20 + Math.random() * 30;
      var sp2 = 780 + Math.random() * 400;
      l2.setAttribute('x1', x2); l2.setAttribute('y1', y2);
      l2.setAttribute('x2', x2 - 6); l2.setAttribute('y2', y2 + len2);
      l2.setAttribute('stroke', '#5A7A9A');
      l2.setAttribute('stroke-width', 1.8);
      l2.setAttribute('opacity', (0.22 + Math.random() * 0.28).toFixed(2));
      g.appendChild(l2);
      rain.push({el: l2, x: x2, y: y2, len: len2, sp: sp2});
    }
  })();

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function easeInOut(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }
  function lerp(a,b,t){ return a+(b-a)*t; }

  var SUBTITLES = [
    {t: 1.0, text: "他的母亲死在一个雨天。"},
    {t: 3.2, text: "赞比趴在母亲身上，哭了整整一夜。"},
    {t: 6.3, text: "第二天被拖走的时候，"},
    {t: 8.3, text: "手里死死攥着一块士兵的脑接口芯片，"},
    {t: 11.7, text: "里面存着那个士兵的全部记忆。"},
    {t: 14.7, text: "死人太多了。"},
    {t: 16.4, text: "我想让他们活过来。"},
    {t: 19.1, text: "这话后来被印在商业教材的扉页上，"},
    {t: 22.4, text: "镀了金边。"},
    {t: 23.3, text: "但没人知道，"},
    {t: 24.5, text: "他说这话的时候才十岁，"},
    {t: 26.7, text: "蹲在垃圾堆旁，"},
    {t: 28.1, text: "正用一根光纤，"},
    {t: 29.5, text: "试图读取那块破芯片里的残存数据。"},
  ];

  window.setTime = function(t){
    var world = document.getElementById('world');
    var rainy = document.getElementById('rainyScene');
    var junk = document.getElementById('junkScene');

    // 1) 淡入 0-1.6s
    world.setAttribute('opacity', clamp(t/1.6, 0, 1));

    // 2) 场景切换：16.5-19s crossfade
    var xf = clamp((t - 16.5) / 2.5, 0, 1);
    rainy.setAttribute('opacity', 1 - xf);
    junk.setAttribute('opacity', xf);

    // 3) 镜头运动
    if (t < 16.5) {
      var e1 = easeInOut(clamp(t/14, 0, 1));
      var s1 = lerp(1, 1.15, e1);
      var tx1 = lerp(0, -90, e1);
      var ty1 = lerp(0, -40, e1);
      world.setAttribute('transform', 'translate(' + tx1 + ',' + ty1 + ') scale(' + s1 + ')');
      world.setAttribute('transform-origin', '760 700');
    } else {
      var e2 = easeInOut(clamp((t - 16.5) / 15, 0, 1));
      var s2 = lerp(1, 1.07, e2);
      world.setAttribute('transform', 'translate(0,' + lerp(0,-18,e2) + ') scale(' + s2 + ')');
      world.setAttribute('transform-origin', '960 760');
    }

    // 4) 少年颤抖（雨天跪伏）
    var tremble = Math.sin(t * 23) * 1.3;
    document.getElementById('boyKneel').setAttribute('transform', 'translate(' + tremble + ',' + Math.abs(tremble)*0.3 + ')');

    // 5) 芯片渐亮（4-12s）
    var chipOn = clamp((t - 4) / 8, 0, 1);
    document.getElementById('chipGlow').setAttribute('opacity', chipOn * 0.95);
    document.getElementById('chipCore').setAttribute('opacity', chipOn);
    document.getElementById('chipCore').setAttribute('r', 3 + chipOn * 5);
    document.getElementById('chipDetail').setAttribute('opacity', chipOn * 0.8);

    // 6) 雨丝下落 + 涟漪
    for (var i = 0; i < rain.length; i++) {
      var r = rain[i];
      var y = (r.y + r.sp * t) % 1080;
      r.el.setAttribute('y1', y);
      r.el.setAttribute('y2', y + r.len);
    }
    var rip1 = (t % 2.2) / 2.2;
    var rip2 = (t % 2.8) / 2.8;
    var r1 = document.getElementById('ripple1');
    var r2 = document.getElementById('ripple2');
    r1.setAttribute('rx', 20 + rip1 * 70);
    r1.setAttribute('opacity', (1 - rip1) * 0.5);
    r2.setAttribute('rx', 16 + rip2 * 60);
    r2.setAttribute('opacity', (1 - rip2) * 0.45);

    // 7) 光纤脉动 + 数据光点（垃圾堆场景）
    var pulse = 0.5 + 0.5 * Math.sin(t * 3.2);
    document.getElementById('fiber').setAttribute('opacity', 0.45 + pulse * 0.5);
    var dot = document.getElementById('fiberDot');
    var dotCyc = (t % 2) / 2;
    dot.setAttribute('cy', 878 - dotCyc * 110);
    dot.setAttribute('opacity', Math.sin(dotCyc * Math.PI) * 0.9);

    // 8) 字幕
    var subText = document.getElementById('subText');
    var subBg = document.getElementById('subBg');
    var cur = null;
    for (var s = 0; s < SUBTITLES.length; s++) {
      if (t >= SUBTITLES[s].t) cur = SUBTITLES[s];
    }
    if (cur && cur.text !== subText.getAttribute('data-cur')) {
      subText.textContent = cur.text;
      subText.setAttribute('data-cur', cur.text);
    }
    var show = cur ? 1 : 0;
    subText.setAttribute('opacity', show);
    subBg.setAttribute('opacity', show * 0.66);

    // 9) 渐暗转场（最后 1.5s）
    var fo = clamp((t - (SCENE_DURATION - 1.5)) / 1.5, 0, 1);
    document.getElementById('fadeOut').setAttribute('opacity', fo);
  };

  setTime(0);
</script>
</body>
</html>
