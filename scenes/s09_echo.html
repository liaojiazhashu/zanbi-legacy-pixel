<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>《赞比的遗产》S09 回声卫星</title>
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#05070C}
  svg{display:block}
  .sub{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-weight:300;letter-spacing:1px}
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 球腔内壁（体积感：左上受光右下背光） -->
    <radialGradient id="sphereGrad" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#1A2230"/>
      <stop offset="0.55" stop-color="#141A26"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </radialGradient>
    <radialGradient id="coreLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FC1E0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#4FC1E0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <g id="world">
    <rect x="0" y="0" width="1920" height="1080" fill="#05070C"/>

    <!-- 球腔内壁（球形剖面） -->
    <g id="sphere">
      <circle cx="960" cy="540" r="470" fill="url(#sphereGrad)" stroke="#242E3E" stroke-width="3"/>
      <!-- 球心冷光 -->
      <circle cx="960" cy="540" r="470" fill="url(#coreLight)"/>
      <!-- 经线（弧线，营造球面） -->
      <g stroke="#242E3E" stroke-width="1.2" opacity="0.55">
        <ellipse cx="960" cy="540" rx="470" ry="470" fill="none"/>
        <ellipse cx="960" cy="540" rx="330" ry="470" fill="none"/>
        <ellipse cx="960" cy="540" rx="165" ry="470" fill="none"/>
        <ellipse cx="960" cy="540" rx="470" ry="330" fill="none"/>
        <ellipse cx="960" cy="540" rx="470" ry="165" fill="none"/>
      </g>
      <!-- 声学面板（六边形拼贴，JS 生成） -->
      <g id="panels"></g>
    </g>

    <!-- 球心平台 -->
    <g id="platform">
      <ellipse cx="960" cy="585" rx="70" ry="18" fill="#1A2230" stroke="#4FC1E0" stroke-width="1.5" opacity="0.8"/>
      <ellipse cx="960" cy="582" rx="70" ry="18" fill="#141A26"/>
      <!-- 平台支柱光 -->
      <line x1="960" y1="585" x2="960" y2="520" stroke="#4FC1E0" stroke-width="1" opacity="0.3"/>
    </g>

    <!-- 球心赞比（渺小，插画级小人物） -->
    <g id="zhanbiAtCore" transform="translate(960, 582)"></g>

    <!-- 声波涟漪（JS 生成） -->
    <g id="ripples"></g>
  </g>

  <!-- 字幕 -->
  <g id="subtitleGroup">
    <rect id="subBg" x="360" y="952" width="1200" height="72" rx="8" fill="#0B0E14" fill-opacity="0.66" opacity="0"/>
    <text id="subText" class="sub" x="960" y="1000" text-anchor="middle" font-size="34" fill="#d9e6f0" opacity="0">第二颗星球，是一颗被整个掏空的卫星。</text>
  </g>

  <rect id="fadeOut" x="0" y="0" width="1920" height="1080" fill="#000" opacity="0"/>
</svg>

<script src="characters.js"></script>
<script>
  window.SCENE_DURATION = 40.6;

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function easeInOut(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }
  function lerp(a,b,t){ return a+(b-a)*t; }

  var NS = 'http://www.w3.org/2000/svg';

  // ---- 声学面板（球内壁六边形/小块拼贴） ----
  (function panels(){
    var g = document.getElementById('panels');
    for (var i = 0; i < 700; i++) {
      // 在球内随机撒点，画小四边形/六边形面板
      var ang = Math.random() * Math.PI * 2;
      var rad = Math.sqrt(Math.random()) * 440; // 均匀分布
      var x = 960 + Math.cos(ang) * rad;
      var y = 540 + Math.sin(ang) * rad;
      var sz = 14 + Math.random() * 22;
      var bright = Math.random();
      var p = document.createElementNS(NS, 'polygon');
      var hex = '';
      for (var k = 0; k < 6; k++) {
        var a = (k / 6) * Math.PI * 2 + Math.random() * 0.3;
        hex += (x + Math.cos(a) * sz).toFixed(1) + ',' + (y + Math.sin(a) * sz).toFixed(1) + ' ';
      }
      p.setAttribute('points', hex);
      p.setAttribute('fill', bright > 0.75 ? '#1A2230' : '#141A26');
      p.setAttribute('stroke', '#242E3E');
      p.setAttribute('stroke-width', '0.6');
      p.setAttribute('opacity', '0.5');
      g.appendChild(p);
    }
  })();

  // ---- 球心赞比（渺小剪影 + 轮廓光） ----
  var coreZhanbi = CH.adult({h: 46, skin:'#0B0E14', hair:'#05070C', hairStyle:'short', suit:'#0B0E14', shirt:'#0B0E14', tie:'#4FC1E0', pants:'#0B0E14', expr:'calm'});
  coreZhanbi.setAttribute('opacity', '0.9');
  document.getElementById('zhanbiAtCore').appendChild(coreZhanbi);

  // ---- 声波涟漪 ----
  var ripples = [];
  (function buildRipples(){
    var g = document.getElementById('ripples');
    for (var i = 0; i < 24; i++) {
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 960); c.setAttribute('cy', 540);
      c.setAttribute('fill', 'none');
      c.setAttribute('stroke', '#4FC1E0');
      c.setAttribute('stroke-width', '2');
      c.setAttribute('opacity', '0');
      g.appendChild(c);
      ripples.push({el: c, delay: i * 0.5});
    }
  })();

  var SUBTITLES = [
    {t: 1.0, text: "第二颗星球，是一颗被整个掏空的卫星。"},
    {t: 4.7, text: "三十二万块精密声学面板，"},
    {t: 7.2, text: "构成一个直径两千公里的球形共振腔。"},
    {t: 10.7, text: "据测算，"},
    {t: 11.5, text: "在球心说一句话，"},
    {t: 13.1, text: "声音会回荡整整十七年。"},
    {t: 15.4, text: "开业那天，"},
    {t: 16.4, text: "赞比站在球心，"},
    {t: 17.8, text: "全场安静，"},
    {t: 18.8, text: "等着他作为第一个发声者说点什么。"},
    {t: 22.1, text: "他想了很久，轻轻喊了一声。"},
    {t: 24.9, text: "我是谁？"},
    {t: 26.4, text: "声音一圈一圈地绕。"},
    {t: 28.2, text: "有个诗人在里面待了七天，"},
    {t: 30.6, text: "出来写下一句话，"},
    {t: 32.1, text: "这是整个银河系最吵闹的地方，"},
    {t: 34.9, text: "也是整个银河系最安静的地方。"}
  ];

  window.setTime = function(t){
    var world = document.getElementById('world');
    world.setAttribute('opacity', clamp(t/1.5, 0, 1));

    // 1) 镜头 0-16s 拉远（展示宏大球形），16-22s 推向球心赞比
    var out = easeInOut(clamp(t / 16, 0, 1));
    var push = clamp((t - 16) / 6, 0, 1);
    var sc = lerp(1, 0.82, out) * lerp(1, 1.3, push);
    var ty = lerp(0, 60, push);
    world.setAttribute('transform', 'translate(0,' + ty + ') scale(' + sc + ')');
    world.setAttribute('transform-origin', '960 540');

    // 2) 声波涟漪：24.9s 台词时从球心扩散，26.4s 后持续回荡
    for (var i = 0; i < ripples.length; i++) {
      var r = ripples[i];
      var startT = 24.9 + r.delay;
      var age = t - startT;
      if (age < 0) { r.el.setAttribute('opacity', '0'); continue; }
      var rad = age * 55;
      if (rad > 460) { r.el.setAttribute('opacity', '0'); continue; }
      r.el.setAttribute('r', rad);
      r.el.setAttribute('opacity', (1 - rad / 460) * 0.5);
      r.el.setAttribute('stroke-width', 2 - rad / 300);
    }

    // 3) 字幕
    var subText = document.getElementById('subText');
    var subBg = document.getElementById('subBg');
    var cur = null;
    for (var s = 0; s < SUBTITLES.length; s++) {
      if (t >= SUBTITLES[s].t) cur = SUBTITLES[s];
    }
    if (cur && cur.text !== subText.getAttribute('data-cur')) {
      subText.textContent = cur.text;
      subText.setAttribute('data-cur', cur.text);
    }
    var show = cur ? 1 : 0;
    subText.setAttribute('opacity', show);
    subBg.setAttribute('opacity', show * 0.66);

    // 4) 渐暗
    var fo = clamp((t - (SCENE_DURATION - 1.5)) / 1.5, 0, 1);
    document.getElementById('fadeOut').setAttribute('opacity', fo);
  };

  setTime(0);
</script>
</body>
</html>
