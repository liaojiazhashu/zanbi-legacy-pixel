<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>《赞比的遗产》S15 立方体拆解</title>
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#080A10}
  svg{display:block}
  .sub{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-weight:300;letter-spacing:1px}
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="office" cx="0.5" cy="0.4" r="0.85">
      <stop offset="0" stop-color="#141A26"/>
      <stop offset="1" stop-color="#070A10"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2838"/>
      <stop offset="1" stop-color="#0F141D"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A4A3A"/>
      <stop offset="1" stop-color="#0E2A22"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <g id="world">
    <rect x="0" y="0" width="1920" height="1080" fill="url(#office)"/>

    <!-- 办公室书架背景 -->
    <g id="shelf" opacity="0.5">
      <rect x="60" y="80" width="500" height="500" fill="#0F141D"/>
      <line x1="60" y1="200" x2="560" y2="200" stroke="#242E3E" stroke-width="8"/>
      <line x1="60" y1="320" x2="560" y2="320" stroke="#242E3E" stroke-width="8"/>
      <line x1="60" y1="440" x2="560" y2="440" stroke="#242E3E" stroke-width="8"/>
      <!-- 书脊 -->
      <g fill="#2A3342">
        <rect x="80" y="100" width="20" height="96"/>
        <rect x="106" y="104" width="14" height="92"/>
        <rect x="126" y="98" width="24" height="98"/>
        <rect x="160" y="102" width="16" height="94"/>
      </g>
    </g>

    <!-- 办公桌 -->
    <rect x="0" y="760" width="1920" height="320" fill="url(#desk)"/>
    <line x1="0" y1="760" x2="1920" y2="760" stroke="#2A3342" stroke-width="2"/>

    <!-- 台灯（桌面右上） -->
    <g id="deskLamp">
      <path d="M 1500 760 L 1500 620 Q 1500 590 1540 570 L 1600 560" fill="none" stroke="#1A2230" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="1600" cy="580" rx="46" ry="18" fill="#D8E0E8" opacity="0.85"/>
      <circle cx="1600" cy="600" r="180" fill="#D8E0E8" opacity="0.06"/>
    </g>

    <!-- 立方体（桌面中央） -->
    <g id="cubeGroup" transform="translate(700, 660)"></g>

    <!-- 声波涟漪 -->
    <g id="soundWave">
      <circle id="sw1" cx="700" cy="600" r="0" fill="none" stroke="#4FC1E0" stroke-width="3" opacity="0"/>
      <circle id="sw2" cx="700" cy="600" r="0" fill="none" stroke="#4FC1E0" stroke-width="2.5" opacity="0"/>
      <circle id="sw3" cx="700" cy="600" r="0" fill="none" stroke="#4FC1E0" stroke-width="2" opacity="0"/>
    </g>

    <!-- 拆解后的 4 零件 -->
    <g id="parts" opacity="0">
      <!-- 声音传感器（麦克风） -->
      <g transform="translate(430, 600)">
        <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#2A3342" stroke="#4FC1E0" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="14" fill="#0B0E14" stroke="#4FC1E0" stroke-width="2"/>
        <g stroke="#4FC1E0" stroke-width="1" opacity="0.5">
          <line x1="-8" y1="0" x2="8" y2="0"/>
          <line x1="0" y1="-8" x2="0" y2="8"/>
        </g>
        <text x="0" y="48" text-anchor="middle" font-size="18" fill="#8B9ED8" font-family="'Microsoft YaHei',sans-serif">声音传感器</text>
      </g>
      <!-- 扬声器 -->
      <g transform="translate(720, 600)">
        <circle cx="0" cy="0" r="34" fill="#1A2230" stroke="#8B9ED8" stroke-width="2"/>
        <circle cx="0" cy="0" r="20" fill="#0B0E14"/>
        <circle cx="0" cy="0" r="7" fill="#8B9ED8"/>
        <text x="0" y="58" text-anchor="middle" font-size="18" fill="#8B9ED8" font-family="'Microsoft YaHei',sans-serif">扬声器</text>
      </g>
      <!-- 同位素电池 -->
      <g transform="translate(1010, 600)">
        <rect x="-24" y="-36" width="48" height="72" rx="8" fill="#3A3A2A" stroke="#D8C060" stroke-width="1.5"/>
        <path d="M -14 -16 L 14 -16 L 0 -2 Z" fill="#D8C060"/>
        <text x="0" y="58" text-anchor="middle" font-size="18" fill="#8B9ED8" font-family="'Microsoft YaHei',sans-serif">同位素电池</text>
      </g>
      <!-- 电路板 -->
      <g transform="translate(1300, 600)">
        <rect x="-70" y="-40" width="140" height="80" rx="6" fill="url(#pcb)" stroke="#4FC1E0" stroke-width="1.5"/>
        <rect x="-20" y="-18" width="40" height="36" rx="3" fill="#0B0E14" stroke="#4FC1E0" stroke-width="1"/>
        <g stroke="#4FC1E0" stroke-width="1.2" opacity="0.7">
          <path d="M -70 -10 L -20 -10 L -20 -18"/>
          <path d="M 20 -18 L 20 18 L 70 18"/>
          <path d="M -70 20 L -20 20"/>
          <path d="M 20 0 L 70 0"/>
        </g>
        <text x="0" y="62" text-anchor="middle" font-size="18" fill="#8B9ED8" font-family="'Microsoft YaHei',sans-serif">电路板</text>
      </g>
    </g>

    <!-- 立方体壳体（拆开） -->
    <g id="shellOpen" opacity="0">
      <g transform="translate(700, 520) rotate(-14)">
        <rect x="-60" y="-60" width="120" height="120" fill="#0B0E14" stroke="#242E3E" stroke-width="2"/>
      </g>
    </g>

    <!-- 程序代码特写 -->
    <g id="code" opacity="0">
      <rect x="560" y="320" width="800" height="300" rx="10" fill="#050A08" stroke="#1A4A3A" stroke-width="2"/>
      <text x="600" y="380" font-size="28" fill="#4FC1E0" font-family="'Consolas','Microsoft YaHei',monospace">if (input == "你好") {</text>
      <text x="640" y="430" font-size="28" fill="#A8D8E8" font-family="'Consolas','Microsoft YaHei',monospace">output("你好，我是赞比");</text>
      <text x="600" y="480" font-size="28" fill="#4FC1E0" font-family="'Consolas','Microsoft YaHei',monospace">}</text>
      <text x="600" y="540" font-size="22" fill="#8B9ED8" font-family="'Consolas','Microsoft YaHei',monospace">// 输入「你好」，输出「你好，我是赞比」</text>
    </g>

    <!-- 片尾标题 -->
    <g id="endTitle" opacity="0">
      <rect x="0" y="0" width="1920" height="1080" fill="#05070C"/>
      <text x="960" y="480" text-anchor="middle" font-size="110" fill="#d9e6f0" font-family="'Microsoft YaHei',serif" letter-spacing="16">赞比的遗产</text>
      <line x1="760" y1="530" x2="1160" y2="530" stroke="#4FC1E0" stroke-width="2" opacity="0.6"/>
      <text x="960" y="590" text-anchor="middle" font-size="30" fill="#8B9ED8" font-family="'Microsoft YaHei',sans-serif" letter-spacing="6">原著 · 野生艺术家</text>
      <text x="960" y="650" text-anchor="middle" font-size="22" fill="#4A5B8C" font-family="'Microsoft YaHei',sans-serif" letter-spacing="4">荒启科幻</text>
    </g>
  </g>

  <g id="subtitleGroup">
    <rect id="subBg" x="360" y="952" width="1200" height="72" rx="8" fill="#0B0E14" fill-opacity="0.66" opacity="0"/>
    <text id="subText" class="sub" x="960" y="1000" text-anchor="middle" font-size="34" fill="#d9e6f0" opacity="0">我看着摆在面前的立方体。</text>
  </g>

  <rect id="fadeOut" x="0" y="0" width="1920" height="1080" fill="#000" opacity="0"/>
</svg>

<script src="characters.js"></script>
<script>
  window.SCENE_DURATION = 46.4;
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function easeInOut(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }
  function lerp(a,b,t){ return a+(b-a)*t; }

  var cube = CH.cube(80);
  document.getElementById('cubeGroup').appendChild(cube);

  var SUBTITLES = [
    {t: 1.0, text: "我看着摆在面前的立方体。"},
    {t: 4.0, text: "表面光滑，没有开机键，不会说话。"},
    {t: 7.8, text: "想把这东西定义为继承人，太困难了。"},
    {t: 12.0, text: "有客户来时。"},
    {t: 13.6, text: "你好，我是赞比。"},
    {t: 16.2, text: "无论我怎么问，它只有这一句。"},
    {t: 19.3, text: "我决定冒险拆开它。"},
    {t: 21.3, text: "专家们拆开黑色的壳子，"},
    {t: 23.8, text: "里面只有四个零件：声音传感器、扬声器、同位素电池，"},
    {t: 29.2, text: "和一个电路板。"},
    {t: 30.8, text: "电路板里，只有一段程序。"},
    {t: 33.6, text: "你好，我是赞比。"},
    {t: 36.2, text: "输入，你好。"},
    {t: 37.7, text: "输出，你好，我是赞比。"},
    {t: 40.5, text: "它继承了赞比的遗产。"}
  ];

  window.setTime = function(t){
    var world = document.getElementById('world');
    world.setAttribute('opacity', clamp(t/1.5, 0, 1));

    // 立方体（0-19s 居中，微转）
    var cubeG = document.getElementById('cubeGroup');
    cubeG.setAttribute('transform', 'translate(700, 660) rotate(' + (t * 3) + ')');
    cubeG.setAttribute('opacity', clamp(t/1.5, 0, 1));

    // 声波（13.6-16s 发声）
    var wavePhase = (t - 13.6) % 1.2;
    for (var w = 0; w < 3; w++) {
      var wp = ((t - 13.6 - w * 0.4) % 1.2);
      var active = (t >= 13.6 && t < 16.2 && wp >= 0 && wp < 1.2);
      var r = wp * 130;
      var sw = document.getElementById('sw' + (w + 1));
      sw.setAttribute('r', r);
      sw.setAttribute('opacity', active ? (1 - wp / 1.2) : 0);
    }

    // 拆解（19.3-29.2s）：立方体隐去，零件浮现
    var open = easeInOut(clamp((t - 19.3) / 2, 0, 1));
    document.getElementById('parts').setAttribute('opacity', open);
    document.getElementById('shellOpen').setAttribute('opacity', open);
    // 立方体 19.3s 后渐隐
    cubeG.setAttribute('opacity', clamp(t/1.5, 0, 1) * (1 - clamp((t - 19.3) / 1.5, 0, 1)));

    // 代码特写（30.8-40s）
    document.getElementById('code').setAttribute('opacity', easeInOut(clamp((t - 30.8) / 1.5, 0, 1)) * (1 - clamp((t - 40) / 1, 0, 1)));

    // 片尾标题（41.5s 后）
    document.getElementById('endTitle').setAttribute('opacity', easeInOut(clamp((t - 41.5) / 1.5, 0, 1)));

    // 字幕（片尾标题出现后字幕隐藏）
    var subText = document.getElementById('subText');
    var subBg = document.getElementById('subBg');
    var cur = null;
    for (var s = 0; s < SUBTITLES.length; s++) { if (t >= SUBTITLES[s].t) cur = SUBTITLES[s]; }
    if (cur && cur.text !== subText.getAttribute('data-cur')) { subText.textContent = cur.text; subText.setAttribute('data-cur', cur.text); }
    var show = cur && t < 41.5 ? 1 : 0;
    subText.setAttribute('opacity', show);
    subBg.setAttribute('opacity', show * 0.66);

    var fo = clamp((t - (SCENE_DURATION - 1.5)) / 1.5, 0, 1);
    document.getElementById('fadeOut').setAttribute('opacity', fo);
  };
  setTime(0);
</script>
</body>
</html>
